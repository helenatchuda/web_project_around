<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Coffee Shop website" />
    <meta name="keywords" content="coffee, shop, cafe, beverages, food" />
    <meta name="author" content="Helena Silva" />
    <title>EUA Afora</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="./images/Vector (1).png"
          alt="Logo EUA Afora"
          class="header__logo"
        />
      </header>

      <main class="main">
        <section class="profile">
          <div class="profile__container">
            <img
              src="./images/Avatar.png"
              alt="Foto de perfil"
              class="profile__avatar"
            />
            <div class="profile__info">
              <h1 class="profile__name">Jacques Cousteau</h1>
              <h2 class="profile__description">Explorador</h2>
              <button class="profile__edit-button" aria-label="Editar perfil">
                <img
                  src="./images/Vector (2).png"
                  alt="Ícone editar perfil"
                  class=""
                />
              </button>
            </div>

            <button class="profile__add-button" aria-label="Adicionar cartão">
              <img
                src="./images/Vector (3).png"
                alt="Ícone mais"
                class=""
              />
            </button>
          </div>
        </section>
      </main>
    </div>

    <template id="card-template">
      <li class="card">
        <div class="card__image-container">
          <img src="#" alt="Imagem do cartão" class="card__image" />
          <button class="card__delete-button" aria-label="Apagar cartão">
            <img
              src="./images/Trash_lixeira.png"
              alt="Lixeira apagar"
              class="card__trash-icon"
            />
          </button>
        </div>
        <div class="card__footer">
          <h2 class="card__title"></h2>
          <img
            src="./images/heart.png"
            alt="Curtir cartão"
            class="card__heart"
          />
        </div>
      </li>
    </template>

    <ul class="cards">
    </ul>

    <div class="popup" id="edit-popup" data-type="edit">
      <div class="popup__container">
        <img
          src="./images/Close Icon.png"
          alt="Fechar popup"
          class="popup__close"
        />

        <h2 class="popup__title">Editar Perfil</h2>
        <form class="popup__form form popup__form-edit-name" novalidate>
          <label for="name">
            <input
              type="text"
              id="name"
              class="form__input"
              placeholder="Nome"
              required
              minlength="2"
              maxlength="40"
            />
            <span
              class="form__error"
              id="name-error"
              aria-live="polite"
            ></span>
          </label>
          <label for="description">
            <input
              type="text"
              id="description"
              class="form__input"
              placeholder="Descrição"
              required
              minlength="2"
              maxlength="200"
            />
            <span
              class="form__error"
              id="description-error"
              aria-live="polite"
            ></span>
          </label>
          <button
            type="submit"
            class="popup__save-button popup__save-button_disabled"
            disabled
          >
            Salvar
          </button>
          <div
            class="form__error-summary"
            role="alert"
            aria-live="polite"
          ></div>
        </form>
      </div>
    </div>

    <div class="popup" id="new-card-popup" data-type="new-card">
      <div class="popup__container">
        <img
          src="./images/Close Icon.png"
          alt="Fechar popup"
          class="popup__close"
        />
        <h2 class="popup__title">Novo Cartão</h2>
        <form class="popup__form form" novalidate>
          <label for="titulo">
            <input
              type="text"
              id="title"
              aria-describedby="title-error"
              class="form__input form__input-title"
              required
              placeholder="Título"
              maxlength="24"
            />
            <span
              class="form__error"
              id="title-error"
              aria-live="polite"
            ></span>
          </label>
          <label for="url-link">
            <input
              type="text"
              id="url-link"
              aria-describedby="url-link-error"
              class="form__input form__input-link"
              required
              placeholder="Link de imagem"
            />
            <span
              class="form__error"
              id="url-link-error"
              aria-live="polite"
            ></span>
          </label>
          <button type="submit" class="popup__save-button">Criar</button>
        </form>
      </div>
    </div>

    <div class="popup" id="image-popup" data-type="open-image">
      <div class="popup__container-image">
        <img
          src="./images/Close Icon.png"
          alt="Fechar imagem"
          class="popup__close"
        />


        <img

          alt="Imagem ampliada"
          class="popup__image"
        />
        <p class="popup__image-title"></p>
      </div>
    </div>

    <footer class="footer">
      <h2 class="footer__copyright">&#169; 2024 Around The U.S.</h2>
    </footer>
    <script type="module" src="./scripts/index.js"></script>

  </body>
</html>
