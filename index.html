<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Coffee Shop website" />
    <meta name="keywords" content="coffee, shop, cafe, beverages, food" />
    <meta name="author" content="Helena Silva" />
    <title>EUA Afora</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body>
    <div class="page">

  <header class="header">
    <img src="./images/Vector (1).png" alt="A imagem escrita em forma de logo" class="header__logo" />
  </header>

  <main class="main">
    <section class="profile">
      <div class="profile__container">
        <img src="./images/Avatar.png" alt="foto de perfil" class="profile__avatar" />
        <div class="profile__info">
          <h1 class="profile__name">Jacques Cousteau</h1>
          <h2 class="profile__description">Explorador</h2>
          <button class="profile__edit-button">
            <img src="./images/Vector (2).png" alt="botão de editar perfil" class="" />
          </button>
        </div>

        <button class="profile__add-button">
          <img src="./images/Vector (3).png" alt="sinal mais para adicionar" class="" />
        </button>
      </div>
    </section>
  </main>

</div>


  <ul class="cards">

    <li class="card">
      <img src="./images/image1_card.jpg" alt="Imagem do card" class="card__image" />
       <button class="card__trash"></button>
      <div class="card__footer">
        <h2 class="card__title">Vale de Yosemite</h2>
        <img src="./images/heart.png" alt="Imagem do coracao" class="card__heart">
      </div>
    </li>
    <li class="card">
      <img src="./images/image2_card.png" alt="Imagem do card" class="card__image" />
      <button class="card__trash"></button>
      <div class="card__footer">
        <h2 class="card__title">Lago Louise</h2>
         <img src="./images/heart.png" alt="Imagem do coracao" class="card__heart">
      </div>
    </li>

    <li class="card">
      <img src="./images/iamge3_card.png" alt="Imagem do card" class="card__image" />
     <button class="card__trash"></button>
      <div class="card__footer">
        <h2 class="card__title">Montanhas Care...</h2>
         <img src="./images/heart.png" alt="Imagem do coracao" class="card__heart">
      </div>
    </li>

    <li class="card">
      <img src="./images/image4_card.png" alt="Imagem do card" class="card__image" />
       <button class="card__trash"></button>
      <div class="card__footer">
        <h2 class="card__title">Latemar</h2>
         <img src="./images/heart.png" alt="Imagem do coracao" class="card__heart">
      </div>
    </li>

    <li class="card">
      <img src="./images/image5_card.png" alt="Imagem do card" class="card__image" />
      <button class="card__trash"></button>
      <div class="card__footer">
        <h2 class="card__title">Parque Nacional...</h2>
         <img src="./images/heart.png" alt="Imagem do coracao" class="card__heart">
      </div>
    </li>
    <li class="card">
      <img src="./images/image6_card.png" alt="Imagem do card" class="card__image" />
      <button class="card__trash"></button>
      <div class="card__footer">
        <h2 class="card__title">Lago di Braies</h2>
         <img src="./images/heart.png" alt="Imagem do coracao" class="card__heart">
      </div>
    </li>
  </ul>


<div class="popup" id="edit-popup" data-type="edit">
  <div class="popup__container">
      <img
              src="./images/Close Icon.png"
              alt=""
              class="popup__close"
               />

    <h2 class="popup__title">Editar Perfil</h2>
     <form class="popup__form form">
              <input type="text" id="name" class="form__input" placeholder="Nome" maxlength="24" />
              <input
                type="text"
                id="description"
                class="form__input"
                placeholder="Descrição"
                maxlength="24" />
              <button type="submit" class="popup__save-button">Salvar</button>
            </form>


  </div>
</div>


<div class="popup" id="new-card-popup">
  <div class="popup__container">
    <img
              src="./images/Close Icon.png"
              alt=""
              class="popup__close"
              />
    <h2 class="popup__title">Novo Cartão</h2>
    <form class="popup__form form">
              <input
                type="text"
                id="titulo"
                class="form__input"
                placeholder="Título"
                maxlength="24" />
              <input type="text" id="url-link" class="form__input" placeholder="Link de imagem" />
              <button type="submit" class="popup__save-button">Criar</button>
            </form>
  </div>
</div>


 <div class="popup" id="image-popup" data-type="open-image">
          <div class="popup__container-image">
            <img
              src="./images/Close Icon.png"
              alt=""
              class="popup__close"
               />
            <img src="" alt="" class="popup__image" />
            <h2 class="popup__image-title"></h2>
          </div>
        </div>
      </main>

    <footer class="footer">
        <h2 class="footer__copyright">&#169; 2024 Around The U.S.</h2>
      </footer>
      <script src="./scripts/index.js"></script>
  </body>
</html>
